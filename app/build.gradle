// app/build.gradle
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.feasycom.feasyhome'
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.feasycom.feasyhome"
        minSdkVersion 29
        targetSdkVersion 36
        versionCode 115
        versionName "2.3.6.1"


        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }



    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            if (buildType.name == 'release') {
                def createTime = new Date().format("YYYY-MM-dd", TimeZone.getTimeZone("GMT+08:00"))
                outputFileName = "FeasyHome${defaultConfig.versionName}_${createTime}.apk"
            }
        }
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation project(':utilcode')
    // mesh 以 AAR 形式引入（源码不在本仓库）；AAR 不携带传递依赖，故在此显式声明
    implementation files('libs/feasyhome-mesh-release.aar')
    implementation 'androidx.annotation:annotation:1.6.0'
    implementation 'com.madgag.spongycastle:core:1.58.0.0'
    implementation 'com.madgag.spongycastle:prov:1.58.0.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.room:room-runtime:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'no.nordicsemi.android.support.v18:scanner:1.6.0'
    implementation 'no.nordicsemi.android:ble:2.6.1'
    implementation 'no.nordicsemi.android:log:2.5.0'

    implementation 'com.github.getActivity:XXPermissions:26.5'
    implementation 'com.alibaba:fastjson:1.2.83'  // 更新版本
    implementation 'com.github.JessYanCoding:AndroidAutoSize:v1.2.1'
    implementation 'com.github.likaiyuan559:TouchEffects:0.4.1'

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$rootProject.kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$rootProject.kotlin_version"

    implementation 'com.squareup.okhttp3:okhttp:4.9.1'

    implementation 'io.github.scwang90:refresh-layout-kernel:2.0.5'
    implementation 'io.github.scwang90:refresh-header-classics:2.0.5'
    implementation 'io.github.scwang90:refresh-header-radar:2.0.5'
    implementation 'io.github.scwang90:refresh-header-falsify:2.0.5'
    implementation 'io.github.scwang90:refresh-header-material:2.0.5'
    implementation 'io.github.scwang90:refresh-header-two-level:2.0.5'
    implementation 'io.github.scwang90:refresh-footer-ball:2.0.5'
    implementation 'io.github.scwang90:refresh-footer-classics:2.0.5'
    implementation 'com.tencent.bugly:crashreport:4.1.9.2'

    implementation 'com.caverock:androidsvg:1.4'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.mylhyl:zxingscanner:2.2.0'

}

